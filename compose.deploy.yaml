# Real-deploy-only overlay — applied on the Oracle VM as a fourth file, never locally:
# docker compose -f compose.yaml -f compose.prod.yaml -f compose.deploy.yaml up -d
# (compose.prod.yaml alone, with or without compose.prod.local.yaml, remains exactly
# Stage 9's local-testing configuration — this file changes nothing about what
# `make prod-up`/`make prod-local-up` run.) Pulls pre-built images (see the `image:`
# tags added to compose.prod.yaml and scripts/build-and-push.sh) rather than building —
# the VM never needs the source tree, only these compose files plus a .env with the
# real SYMBOLS/CORS_ORIGIN/SENTRY_DSN values.
#
# Caddy (TLS, reverse proxy) is NOT part of this file — it moved out into its own,
# separate Compose project on the VM once a second app needed to share the same box and
# the same two ports. DOMAIN, the Caddyfile, and the caddy service itself all live there
# now, not here. See DECISIONS.md.

services:
  # Neither kafka nor redis has ever had a restart: policy set — Compose's own default
  # when the key is simply absent is "no" (never auto-restart), which would leave both
  # sitting stopped after a reboot exactly like Stage 9's on-failure:N would for the app
  # services (verified live — see DECISIONS.md). Unlike ingester/consumer, neither has a
  # designed deliberate-non-retryable-exit-code case in this project, so there's no
  # equivalent tradeoff being made here — this is a pure gap-close, not a traded bound.
  kafka:
    restart: unless-stopped
    # First pass at this (timeout 15s/start_period 60s) assumed the x86-vs-arm64 gap was
    # the ~20% slowdown the api showed. Measured directly on the real box, it's 10x, not
    # 20%: kafka-broker-api-versions.sh took 45s there (under 5s locally) — free-tier
    # Ampere CPU shares, not a hang. Timeout/start_period raised again to match. The test
    # itself is also replaced below — see DECISIONS.md for why a JVM-spawning probe is
    # the wrong shape of check on CPU-starved hardware, verified before switching it.
    healthcheck:
      # Replaces compose.yaml's kafka-broker-api-versions.sh (a full JVM spawn — the
      # Kafka CLI tools boot a JVM to send one request) with a bare TCP connect: busybox
      # `nc` is already in apache/kafka:4.3.1, costs no JVM startup, and — confirmed by
      # reading this exact config's own startup log, not assumed — the broker's listener
      # socket for 9092 only starts accepting once BrokerServer finishes unfencing and
      # transitions to RUNNING (`Finished waiting for all of the SocketServer Acceptors
      # to be started` logs under 1ms before `Kafka Server started`), so "port accepts a
      # connection" and "broker is actually ready" are the same moment for this
      # single-node KRaft setup. Full `test`/`interval`/`retries` restated — this is no
      # longer compose.yaml's command, so there's nothing left to merge per-key.
      test: ["CMD-SHELL", "nc -z -w 5 localhost 9092"]
      interval: 30s
      timeout: 60s
      retries: 10
      start_period: 180s

  redis:
    restart: unless-stopped

  # Trades away Stage 9's bounded crash-loop for reboot survival — on-failure:N cannot
  # give the latter (confirmed live: a daemon restart does not resume an on-failure
  # container, only always/unless-stopped do). This is a real tradeoff, not a pure
  # upgrade — see DECISIONS.md for exactly what's given up, why it's accepted now
  # specifically, and what would actually give both properties if this ever needs it
  # (not built: a persisted-failure-count watchdog, since Docker's and systemd's own
  # restart counters both reset on their own process restart, same gap either way).
  ingester:
    restart: unless-stopped

  consumer:
    restart: unless-stopped
    # The Dockerfile's own HEALTHCHECK (timeout=5s, start_period=30s) is a compose-level
    # blind spot, not a compose-merged field — there's no base-file healthcheck entry for
    # this service to merge with, so the test command is restated here in full, identical
    # to the Dockerfile's CMD. Measured on the real box: Spring startup took 233s (api;
    # consumer's own JVM startup is the same shape), not the mild slowdown first assumed
    # — timeout/start_period raised again to match, and interval widened so the probe
    # itself, a JVM spawn (HealthCheckCli isn't cheap on this hardware either, though not
    # swapped out the way kafka's was — see DECISIONS.md for why), isn't run back-to-back
    # at near-100% duty cycle once it reliably takes tens of seconds.
    healthcheck:
      test: ["CMD", "java", "-cp", "/healthcheck-classes", "HealthCheckCli"]
      interval: 30s
      timeout: 60s
      start_period: 300s
      retries: 3
    environment:
      # 1024M/-Xmx768m, not Stage 9's 512M/-Xmx384m: both consumer and api ran at
      # 81-86% of 512M locally under real traffic at dev scale (3 symbols) — closer to
      # the ceiling than production's 10-20 symbols would leave comfortable, and the
      # Oracle box has far more headroom than the 4GB this was originally planned
      # against (Stage 5's deployment-target change). Heap kept well under the new
      # container limit, same margin as before, just at a size with real room in it.
      JAVA_TOOL_OPTIONS: "-Xmx768m -Xms768m"
    deploy:
      resources:
        limits:
          memory: 1024M

  api:
    restart: unless-stopped
    # Same gap as consumer, same fix, and the measured number: Spring startup took 233s
    # on the real box. See DECISIONS.md.
    healthcheck:
      test: ["CMD", "java", "-cp", "/healthcheck-classes", "HealthCheckCli"]
      interval: 30s
      timeout: 60s
      start_period: 300s
      retries: 3
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx768m -Xms768m"
    deploy:
      resources:
        limits:
          memory: 1024M
    # Caddy used to reach the api over this compose project's own internal network, so no
    # host port was needed. Caddy has since moved out into its own, separate Compose
    # project on the VM (shared across this app and a second one), so this is now the
    # only way anything outside this project's network can reach the api at all.
    # Loopback-only — same convention as compose.prod.local.yaml's dev-testing port, and
    # the thing that keeps this compliant with invariant #10 (Kafka/Redis, and now this,
    # never reachable from the public internet): only a process on the VM itself — the
    # other Caddy project — can connect, nothing off-box can. See DECISIONS.md.
    ports:
      - "127.0.0.1:8080:8080"
