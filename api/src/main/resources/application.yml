server:
  port: ${SERVER_PORT:8080}
  # Lets Tomcat's own RemoteIpValve substitute X-Forwarded-For into getRemoteAddr(), but
  # only when the direct peer is in its internal/private-range allowlist (RFC1918 +
  # loopback + link-local by default) — which is exactly where Caddy sits on the compose
  # network, and exactly not where a public-internet client sits. See DECISIONS.md for why
  # this relies on Tomcat's own default range instead of a narrower hand-picked one.
  forward-headers-strategy: native
  # Boot's actual default here is GRACEFUL (confirmed by decompiling ServerProperties'
  # constructor), which waits up to spring.lifecycle.timeout-per-shutdown-phase (30s) for
  # "active requests" to finish before forcing them closed. An SSE stream is never
  # finished by design — graceful mode doesn't wait less for one, it waits the FULL grace
  # period, every single shutdown, for every still-connected client. Confirmed live: a
  # connected curl client was still alive 25s after SIGTERM under the default. IMMEDIATE
  # closes the connector right away instead, which is what "killing the api makes clients
  # reconnect" (CLAUDE.md's own done-when) actually needs. See DECISIONS.md.
  shutdown: immediate

spring:
  application:
    name: api
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

app:
  # Same SYMBOLS format/variable as the ingester and consumer (see DECISIONS.md for the
  # drift risk this creates — three services, three independent reads of one env var).
  symbols: ${SYMBOLS:BTC-USD}
  alert:
    ttl-seconds: ${ALERT_TTL_SECONDS:3600}
    global-cap: ${ALERT_GLOBAL_CAP:100}
    rate-limit-per-minute: ${ALERT_RATE_LIMIT_PER_MINUTE:10}
  cors:
    origin: ${CORS_ORIGIN:http://localhost:5173}
  sse:
    # 100ms: still coalesces a meaningful burst of trades into one update per symbol,
    # fast enough to read as live. Heartbeat interval is separately fixed at 15s (the
    # keep-alive path, not the data path) — see DECISIONS.md.
    throttle-ms: ${SSE_THROTTLE_MS:100}

logging:
  structured:
    format:
      console: ecs
