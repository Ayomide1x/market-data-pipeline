spring:
  application:
    name: consumer
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:29092}
    consumer:
      group-id: ema-consumers
      auto-offset-reset: earliest
      # Distinguishes instances in logs/kafka-consumer-groups --describe when running more
      # than one locally (Stage 4) — Kafka's own auto-generated client-id is per-JVM, not
      # per-process, so two separate instances would otherwise both log as "...-1".
      client-id: ${CONSUMER_CLIENT_ID:consumer-ema-consumers}
      properties:
        # Classic group protocol, cooperative-sticky alone (not the client's own default
        # list, [Range, CooperativeSticky] — that list exists for migrating an existing
        # production group off Range in one bounce, which doesn't apply starting fresh).
        # See DECISIONS.md for why this stays on the classic protocol, not KIP-848's newer
        # "consumer" one.
        partition.assignment.strategy: org.apache.kafka.clients.consumer.CooperativeStickyAssignor
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      # Without this, Lettuce's own default (60s) governs every blocked command, not the
      # error handler's backoff — discovered live: a Redis outage took 60s+ per retry
      # attempt to even fail, not the few seconds the backoff config implies. See DECISIONS.md.
      timeout: 2000ms

app:
  ema:
    # Reacts to a price move over tens of seconds, not individual trades. See DECISIONS.md.
    tau-ms: ${EMA_TAU_MS:300000}

logging:
  structured:
    format:
      console: ecs
